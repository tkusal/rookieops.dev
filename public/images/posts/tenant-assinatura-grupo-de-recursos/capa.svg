<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tenant, assinatura e grupo de recursos no Azure</title>
  <desc id="desc">Ilustração original com três cartões conectados que representam identidade, governança e ciclo de vida operacional.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="60" x2="1510" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07172C"/>
      <stop offset="0.54" stop-color="#0B3158"/>
      <stop offset="1" stop-color="#075A80"/>
    </linearGradient>
    <linearGradient id="tenantCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1858A8"/>
      <stop offset="1" stop-color="#2379D1"/>
    </linearGradient>
    <linearGradient id="subscriptionCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#007F9E"/>
      <stop offset="1" stop-color="#10A6B7"/>
    </linearGradient>
    <linearGradient id="resourceCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3862B8"/>
      <stop offset="1" stop-color="#6B5ED2"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#D8EEFF" stroke-opacity=".06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#001225" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#85DEFF"/>
    </marker>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 4px; }
      .headline { font-size: 68px; font-weight: 750; letter-spacing: -2px; }
      .subtitle { font-size: 27px; font-weight: 450; }
      .card-kicker { font-size: 17px; font-weight: 700; letter-spacing: 2px; }
      .card-title { font-size: 29px; font-weight: 700; }
      .card-copy { font-size: 19px; font-weight: 450; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#background)"/>
  <rect width="1600" height="900" rx="36" fill="url(#grid)"/>
  <circle cx="1450" cy="42" r="330" fill="#21B8E8" opacity=".10"/>
  <circle cx="1330" cy="800" r="290" fill="#8175FF" opacity=".12"/>
  <circle cx="60" cy="830" r="240" fill="#1473E6" opacity=".11"/>

  <g class="ui" fill="#F5FBFF">
    <text x="112" y="122" class="eyebrow" fill="#72D8FF">ROOKIEOPS • AZURE</text>
    <text x="112" y="226" class="headline">
      <tspan x="112">Tenant, assinatura</tspan>
      <tspan x="112" dy="80">e grupo de recursos</tspan>
    </text>
    <text x="116" y="420" class="subtitle" fill="#C9E9F8">
      <tspan x="116">Três limites diferentes.</tspan>
      <tspan x="116" dy="40">Uma arquitetura coerente.</tspan>
    </text>

    <g transform="translate(112 548)">
      <rect width="430" height="58" rx="29" fill="#D7F4FF" fill-opacity=".10" stroke="#C8F2FF" stroke-opacity=".22"/>
      <circle cx="32" cy="29" r="8" fill="#72D8FF"/>
      <text x="55" y="37" font-size="21" font-weight="600" fill="#DDF5FF">Identidade • Governança • Ciclo de vida</text>
    </g>
  </g>

  <g filter="url(#shadow)" class="ui">
    <path d="M1040 278C1040 319 1002 335 1002 372" fill="none" stroke="#85DEFF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1040 498C1040 539 1074 553 1074 590" fill="none" stroke="#85DEFF" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(825 105)">
      <rect width="430" height="174" rx="28" fill="url(#tenantCard)" stroke="#B6E5FF" stroke-opacity=".34"/>
      <circle cx="70" cy="71" r="34" fill="#D9F1FF" fill-opacity=".16"/>
      <circle cx="70" cy="62" r="12" fill="none" stroke="#F3FBFF" stroke-width="5"/>
      <path d="M48 91C53 75 87 75 92 91" fill="none" stroke="#F3FBFF" stroke-width="5" stroke-linecap="round"/>
      <text x="126" y="52" class="card-kicker" fill="#BDE8FF">IDENTIDADE</text>
      <text x="126" y="91" class="card-title" fill="#FFFFFF">Tenant</text>
      <text x="126" y="124" class="card-copy" fill="#DCEFFF">Diretório e confiança</text>
    </g>

    <g transform="translate(765 325)">
      <rect width="550" height="174" rx="28" fill="url(#subscriptionCard)" stroke="#C5F7FF" stroke-opacity=".34"/>
      <circle cx="70" cy="71" r="34" fill="#D8FBFF" fill-opacity=".16"/>
      <rect x="53" y="48" width="34" height="44" rx="5" fill="none" stroke="#F2FEFF" stroke-width="5"/>
      <path d="M61 61H79M61 72H79M61 83H73" stroke="#F2FEFF" stroke-width="4" stroke-linecap="round"/>
      <text x="126" y="52" class="card-kicker" fill="#C9F8FF">GOVERNANÇA E CONSUMO</text>
      <text x="126" y="91" class="card-title" fill="#FFFFFF">Assinatura do Azure</text>
      <text x="126" y="124" class="card-copy" fill="#DFFFFF">Recursos, custos, cotas e políticas</text>
    </g>

    <g transform="translate(855 545)">
      <rect width="470" height="174" rx="28" fill="url(#resourceCard)" stroke="#DCD6FF" stroke-opacity=".34"/>
      <circle cx="70" cy="71" r="34" fill="#E5E0FF" fill-opacity=".15"/>
      <path d="M53 55L70 46L87 55L70 64L53 55ZM53 59V78L70 87V68L53 59ZM87 59V78L70 87V68L87 59Z" fill="none" stroke="#FAF9FF" stroke-width="4" stroke-linejoin="round"/>
      <text x="126" y="52" class="card-kicker" fill="#DDD9FF">CICLO DE VIDA</text>
      <text x="126" y="91" class="card-title" fill="#FFFFFF">Grupo de recursos</text>
      <text x="126" y="124" class="card-copy" fill="#ECE9FF">Implantar, operar e remover junto</text>
    </g>
  </g>

  <g class="ui" transform="translate(828 782)">
    <path d="M0 0H496" stroke="#AEE8FF" stroke-opacity=".22"/>
    <text x="0" y="38" font-size="18" font-weight="600" fill="#CBEFFF">Relações de confiança</text>
    <text x="318" y="38" font-size="18" font-weight="600" fill="#D9D4FF">Escopos do Azure</text>
  </g>
</svg>

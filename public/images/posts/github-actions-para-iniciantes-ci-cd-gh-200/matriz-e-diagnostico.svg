<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Da matriz aos logs de diagnóstico</title>
  <desc id="desc">Uma matriz com Node.js 22 e 24 cria dois jobs. Quando uma variante falha, o fluxo destaca o job, o step e a primeira mensagem de erro relevante.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10152b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233b"/>
      <stop offset="1" stop-color="#10182a"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#background)"/>
  <circle cx="1320" cy="100" r="250" fill="#4f46e5" opacity="0.08"/>
  <circle cx="160" cy="820" r="300" fill="#06b6d4" opacity="0.06"/>

  <text x="100" y="94" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="44" font-weight="700">Uma matriz, duas evidências</text>
  <text x="100" y="136" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="24">O GitHub Actions expande cada valor em um job independente.</text>

  <rect x="100" y="200" width="390" height="230" rx="24" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <text x="140" y="252" fill="#67e8f9" font-family="Consolas, monospace" font-size="25">strategy:</text>
  <text x="170" y="296" fill="#c4b5fd" font-family="Consolas, monospace" font-size="25">matrix:</text>
  <text x="200" y="340" fill="#e2e8f0" font-family="Consolas, monospace" font-size="25">node: [22, 24]</text>
  <rect x="140" y="374" width="170" height="34" rx="17" fill="#0e7490" opacity="0.35"/>
  <text x="159" y="398" fill="#a5f3fc" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="600">1 definição YAML</text>

  <path d="M 510 315 C 590 315, 600 263, 680 263" fill="none" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)" filter="url(#glow)"/>
  <path d="M 510 315 C 590 315, 600 390, 680 390" fill="none" stroke="#38bdf8" stroke-width="6" marker-end="url(#arrow)" filter="url(#glow)"/>

  <rect x="700" y="190" width="350" height="145" rx="24" fill="url(#panel)" stroke="#22c55e" stroke-width="3"/>
  <circle cx="755" cy="262" r="27" fill="#14532d"/>
  <path d="M 742 262 L 752 272 L 770 250" fill="none" stroke="#86efac" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="805" y="252" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="700">Node 22</text>
  <text x="805" y="286" fill="#86efac" font-family="Inter, Segoe UI, sans-serif" font-size="20">testes aprovados</text>

  <rect x="700" y="355" width="350" height="145" rx="24" fill="url(#panel)" stroke="#22c55e" stroke-width="3"/>
  <circle cx="755" cy="427" r="27" fill="#14532d"/>
  <path d="M 742 427 L 752 437 L 770 415" fill="none" stroke="#86efac" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="805" y="417" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="700">Node 24</text>
  <text x="805" y="451" fill="#86efac" font-family="Inter, Segoe UI, sans-serif" font-size="20">testes aprovados</text>

  <rect x="1120" y="190" width="380" height="310" rx="24" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <text x="1160" y="240" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="700">Resultado da CI</text>
  <line x1="1160" y1="267" x2="1460" y2="267" stroke="#334155" stroke-width="2"/>
  <text x="1160" y="312" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="20">Node 22</text>
  <text x="1414" y="312" fill="#86efac" font-family="Inter, Segoe UI, sans-serif" font-size="20">✓</text>
  <text x="1160" y="359" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="20">Node 24</text>
  <text x="1414" y="359" fill="#86efac" font-family="Inter, Segoe UI, sans-serif" font-size="20">✓</text>
  <rect x="1160" y="400" width="300" height="54" rx="15" fill="url(#flow)" opacity="0.9"/>
  <text x="1215" y="435" fill="#ffffff" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700">evidência reproduzível</text>

  <text x="100" y="590" fill="#f8fafc" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="700">Quando uma variante falha</text>
  <text x="100" y="630" fill="#94a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="22">Siga o caminho mais curto até a causa.</text>

  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="100" y="676" width="285" height="112" rx="22" fill="url(#panel)" stroke="#ef4444" stroke-width="3"/>
    <circle cx="148" cy="732" r="24" fill="#7f1d1d"/>
    <path d="M 137 721 L 159 743 M 159 721 L 137 743" stroke="#fca5a5" stroke-width="6" stroke-linecap="round"/>
    <text x="190" y="723" fill="#f8fafc" font-size="24" font-weight="700">1. Job vermelho</text>
    <text x="190" y="757" fill="#fca5a5" font-size="18">identifique a variante</text>

    <path d="M 400 732 L 470 732" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="490" y="676" width="285" height="112" rx="22" fill="url(#panel)" stroke="#f59e0b" stroke-width="3"/>
    <text x="530" y="723" fill="#f8fafc" font-size="24" font-weight="700">2. Primeiro step</text>
    <text x="530" y="757" fill="#fcd34d" font-size="18">abra a etapa que falhou</text>

    <path d="M 790 732 L 860 732" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="880" y="650" width="620" height="165" rx="22" fill="#090e19" stroke="#ef4444" stroke-width="2"/>
    <text x="920" y="696" fill="#fca5a5" font-family="Consolas, monospace" font-size="20">AssertionError: título inesperado</text>
    <text x="920" y="735" fill="#94a3b8" font-family="Consolas, monospace" font-size="18">esperado: Laboratório GitHub Actions</text>
    <text x="920" y="769" fill="#e2e8f0" font-family="Consolas, monospace" font-size="18">recebido: Laboratório quebrado</text>
  </g>

  <text x="100" y="855" fill="#64748b" font-family="Inter, Segoe UI, sans-serif" font-size="20">Evento → job → step → primeira mensagem relevante</text>
</svg>
